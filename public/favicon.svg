<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="55%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A07800"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#edgeGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Coin Surface -->
  <circle cx="256" cy="256" r="216" fill="url(#coinGrad)"/>
  
  <!-- Inner Border Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- Letter C for Cara -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="220" 
        font-weight="900" 
        fill="#5A3E00" 
        text-anchor="middle"
        letter-spacing="-5">C</text>
</svg>